services:
  proxy:
    image: nginx:1.27.3-alpine3.20-perl
    container_name: lff-proxy
    restart: always
    ports:
      - 80:80
      - 443:443
    volumes:
      # ⚠ Zones limit_req partagées par les vhosts sportgestions. Le préfixe 00- garantit que
      # nginx les lit AVANT les vhosts qui les utilisent (conf.d/*.conf est inclus par ordre
      # alphabétique). Ce montage manquant = nginx refuse de démarrer, donc LES DEUX sites
      # tombent, pas seulement sportgestions.
      - ./00-zones-limits.conf:/etc/nginx/conf.d/00-zones-limits.conf
      - ./api-lff.conf:/etc/nginx/conf.d/api-lff.conf
      - ./web-lff.conf:/etc/nginx/conf.d/web-lff.conf
      - ./web-sportgestions.conf:/etc/nginx/conf.d/web-sportgestions.conf
      - ./api-sportgestions.conf:/etc/nginx/conf.d/api-sportgestions.conf
      - /etc/letsencrypt/live:/etc/letsencrypt/live
      - /etc/letsencrypt/archive:/etc/letsencrypt/archive
    networks:
      - lafacturefacile-network
      - sportgestions-network
networks:
  lafacturefacile-network:
    external: true
    name: lafacturefacile-network
  sportgestions-network:
    external: true
    name: sportgestions-network
