# sportgestions.fr → frontend Angular (+ /api routé vers le backend, même origine = pas de CORS)

# Redirection HTTP → HTTPS + bascule www vers le domaine nu
server {
    listen 80;
    listen [::]:80;
    server_name sportgestions.fr www.sportgestions.fr;
    return 301 https://sportgestions.fr$request_uri;
}

# www → domaine nu (en HTTPS)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.sportgestions.fr;

    ssl_certificate /etc/letsencrypt/live/sportgestions.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sportgestions.fr/privkey.pem;

    return 301 https://sportgestions.fr$request_uri;
}

# Domaine principal
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name sportgestions.fr;

    ssl_certificate /etc/letsencrypt/live/sportgestions.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sportgestions.fr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 12M;   # documents médicaux (max 10 Mo applicatif)

    # ── Routes d'authentification PUBLIQUES : limite stricte (zone sg_login, 00-zones-limits.conf)
    #
    # `location =` est un match EXACT, prioritaire sur le préfixe `/api/` ci-dessous. C'est
    # volontaire et nécessaire : ⚠ /api/auth/me NE DOIT PAS tomber sous cette limite. Le front
    # l'appelle à chaque démarrage ET à chaque retour au premier plan de la PWA pour renouveler
    # le jeton (cf. app.jwt.expiration-ms) — une limite serrée y déconnecterait les joueurs.
    # Un `location /api/auth/` par préfixe attraperait /me : ne pas « simplifier » en cela.
    location = /api/auth/login {
        limit_req zone=sg_login burst=10 nodelay;
        limit_req_status 429;   # par défaut nginx répond 503, qui ne dit pas la bonne chose
        proxy_pass http://sportgestions-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    # Échange du jeton d'invitation au match en direct (permitAll dans SecurityConfig) : un jeton
    # se devine comme un mot de passe, il mérite donc la même limite que le login.
    location = /api/acces-direct/echange {
        limit_req zone=sg_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://sportgestions-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    # API : le front appelle /api en relatif → on route vers le backend (même origine)
    location /api/ {
        limit_req zone=sg_api burst=50 nodelay;
        limit_req_status 429;
        proxy_pass http://sportgestions-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_connect_timeout 15s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    # Tout le reste : frontend Angular (SPA)
    location / {
        proxy_pass http://sportgestions-frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }
}
