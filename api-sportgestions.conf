# api.sportgestions.fr → backend Spring Boot (accès direct à l'API, usage externe/intégrations)

server {
    listen 80;
    server_name api.sportgestions.fr;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.sportgestions.fr;

    ssl_certificate /etc/letsencrypt/live/api.sportgestions.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.sportgestions.fr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 12M;

    # Mêmes limites que web-sportgestions.conf : ce vhost expose le MÊME backend, le protéger
    # d'un seul côté ne protégerait rien. Zones définies dans 00-zones-limits.conf.
    # (Le trafic réel de l'application passe par sportgestions.fr/api — ici c'est l'accès direct.)
    location = /api/auth/login {
        limit_req zone=sg_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://sportgestions-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    location = /api/acces-direct/echange {
        limit_req zone=sg_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://sportgestions-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    location / {
        limit_req zone=sg_api burst=50 nodelay;
        limit_req_status 429;
        proxy_pass http://sportgestions-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }
}
