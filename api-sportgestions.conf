# api.sportgestions.fr → backend Spring Boot (accès direct à l'API, usage externe/intégrations)

server {
    listen 80;
    server_name api.sportgestions.fr;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.sportgestions.fr;

    ssl_certificate /etc/letsencrypt/live/api.sportgestions.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.sportgestions.fr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 12M;

    location / {
        proxy_pass http://sportgestions-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }
}
