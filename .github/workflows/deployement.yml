name: deploy lff proxy

on:
  push:
    branches:
      - main

env:
  IMAGE: lff-proxy

jobs:
  create-folder:
    name: create folder
    runs-on: ubuntu-latest
    steps:
      - name: execute commands
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.PRIVATE_KEY }}
          port: 22
          script: |
            mkdir -p /opt/applications/lff/${{ env.IMAGE }}

  run-container:
    name: run container
    runs-on: ubuntu-latest
    needs: ['create-folder']
    steps:
      - name: cloner le repertoire
        uses: actions/checkout@v3

      - name: copy file via ssh key
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.PRIVATE_KEY }}
          port: 22
          # ⚠ La liste est EXPLICITE : un fichier de conf absent d'ici n'arrive jamais sur le VPS.
          # 00-zones-limits.conf porte les zones limit_req utilisées par les deux vhosts
          # sportgestions — l'oublier fait échouer le démarrage de nginx, donc les DEUX sites.
          source: "compose.yml,00-zones-limits.conf,api-lff.conf,web-lff.conf,web-sportgestions.conf,api-sportgestions.conf"
          target: /opt/applications/lff/${{ env.IMAGE }}

      - name: deploy et reload nginx
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.PRIVATE_KEY }}
          port: 22
          script: |
            cd /opt/applications/lff/${{ env.IMAGE }}
            # docker-compose v1 plante sur "recreate" (KeyError ContainerConfig) avec les images recentes
            # -> on supprime le container puis on le (re)cree a neuf (pas de recreate)
            docker-compose rm -sf proxy || true
            docker-compose up -d
