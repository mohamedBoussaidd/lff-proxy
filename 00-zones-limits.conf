# ═══════════════════════════════════════════════════════════════════════════════
# Zones de limitation de débit — contexte http, partagées par les vhosts sportgestions.
#
# ⚠ LE NOM DU FICHIER COMMENCE PAR 00- ET CE N'EST PAS DÉCORATIF.
# nginx inclut `conf.d/*.conf` dans l'ordre ALPHABÉTIQUE, et un `limit_req zone=X`
# échoue au démarrage ("unknown limit_req_zone") si la zone X n'a pas encore été lue.
# Renommer ce fichier après `api-` ou `web-` empêcherait nginx de démarrer — donc les
# DEUX applications du proxy, pas seulement sportgestions.
#
# ⚠ Ces zones sont VOLONTAIREMENT LARGES, et c'est le point le plus important du fichier.
# Dans un club, tout le monde est derrière le même wifi : 25 joueurs qui se connectent au
# vestiaire arrivent avec UNE SEULE adresse IP publique. Une limite calquée sur celle de
# simplefacture (5 req/min, zone `auth_strict` d'api-lff.conf) bloquerait vingt joueurs
# légitimes sans gêner sérieusement un attaquant, qui n'a besoin que d'une IP.
#
# Ce que ces zones arrêtent : le flood brutal.
# Ce qu'elles n'arrêtent PAS : le brute-force patient sur un compte — c'est le rôle du
# blocage par compte côté application (utilisateur.echecs_connexion / bloque_jusqua, V136),
# qui compte les échecs PAR IDENTIFIANT et se moque donc du partage d'adresse.
#
# Les zones d'api-lff.conf (auth_strict, req_limit_per_ip) restent où elles sont :
# simplefacture n'est pas concerné par ce fichier.
# ═══════════════════════════════════════════════════════════════════════════════

# Connexion et échange de jeton d'invitation : 30 tentatives par minute et par IP.
# Un vestiaire entier passe ; un script qui déroule un dictionnaire est freiné.
limit_req_zone $binary_remote_addr zone=sg_login:10m rate=30r/m;

# Reste de l'API : 30 requêtes par seconde et par IP.
# Repère : le dashboard du préparateur déclenche une quinzaine d'appels au chargement,
# et une équipe entière peut ouvrir l'application en même temps derrière la même IP.
limit_req_zone $binary_remote_addr zone=sg_api:10m rate=30r/s;
